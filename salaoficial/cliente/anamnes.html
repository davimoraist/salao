<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width= , initial-scale=1.0">
    <link rel="stylesheet" href="css/ficha.css">
    <title>Document</title>
</head>
<body>
    <div class="ficha">
       <h1>ficha anamnese</h1>
       <h2>alongamento de unhas</h2> 
       <form action="#" class="form-box">
         <div>
             <label for="idade">data de nascimento</label>
             <input type="date" name="idade" id="idade">
         </div>
         <div>
             <label for="enderaco">Endereço</label>
             <input type="text" name="enderaco" id="enderaco">
         </div>
         <div>
             <label for="tel">Telefone</label>
             <input type="tel" name="tel" id="tel">
         </div>
         <div>
             <label for="cpf">CPF</label>
             <input type="cpf" name="cpf" id="cpf">
         </div>
        <div>
             <p>Como Nos Conheceu</p>
             <div>
                 <input type="radio" name="Como" id="facebook">
                 <label for="facebook">Facebook</label>
             </div>
             <div>
                 <input type="radio" name="Como" id="instagram">
                 <label for="instagram">Instagram</label>
             </div>
             <div>
                 <input type="radio" name="Como" id="indicacao">
                 <label for="indicacao">Indecação</label>
                 <input type="text" name="indicacao" >
             </div>
             <div>
                 <input type="radio" name="Como" id="outros">
                 <label for="outros">Outros</label>
                 <input type="text" name="outros" > 
             </div>
             <div>
                <p>Tem Diabets?</p>
                <input type="radio" name="diabets" id="sim">
                <label for="sim">Sim</label>
                <input type="radio" name="diabets" id="nao">
                <label for="nao">Não</label>
             </div>
               <div>
                <p>É Gestante?</p>
                <input type="radio" name="Gestante" id="esim">
                <label for="esim">Sim</label>
                <input type="radio" name="Gestante" id="enao">
                <label for="enao">Não</label>
             </div>
               <div>
                <p>Possui Alergias a esmalte, cosmético ou algum outro componente?</p>
                <input type="radio" name="Alergias" id="psim">
                <label for="psim">Sim</label>
                <input type="radio" name="Alergias" id="pnao">
                <label for="pnao">Não</label>
             </div>
             <div>
                <label for="Especifique">Especifique:</label>
                <input type="text" name="Especifique" id="Especifique">
             </div>
             <div> 
                <p>Costuma retirar a cunticula (eponiquio)?</p>
                <input type="radio" name="Alergias" id="csim">
                <label for="csim">Sim</label>
                <input type="radio" name="Alergias" id="cnao">
                <label for="cnao">Não</label>
             </div>
        </div>
       </form>
    </div>
</body>
</html>
