<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mtnaildesigner.com</title>
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="css/paga.css">
</head>
<body>
    <div id="pagamento">
        <div class="paga" id="dados">
            <label for="nome">Nome Completo</label>
            <input type="text" name="mome" id="nome">
            <label for="email">Seu E-mail</label>
            <input type="text" name="email" id="enail">
            <label for="cpf">CPF</label>
            <input type="text" name="cpf" id="cpf">
            <label for="cep">CEP</label>
            <input type="text" name="cep" id="cep">

            <p>Qual é forma de pagamento?</p>
            <div class="forma-pix">
                <button id="forma-pix" onclick="pixgera()">PIX</button>
            </div>
            <div class="forma-credito">
                <button id="forma-credito" onclick="creditopaga()">Crédito</button>
            </div>
            <div class="forma-debito">
                <button id="forma-debito" onclick="deditopaga()">Débito</button>
            </div>

        </div>
        <div class="paga" id="peco">
            <p>Total R$ 00,00</p>
            <p>Serviço</p>
            <p>Horairo e Data</p>

            <div class="forma-pagamendo">
                <h1 class="texto">Forma de pagamento</h1>
                
            </div>
        </div>
    </div>
    <script src="paga.js"></script>
</body>
</html>
