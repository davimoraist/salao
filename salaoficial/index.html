<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mariar tavares nail design </title>
    <link rel="shortcut icon" href="favicon_io/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="css/clientes.css">
</head>
<body>
    <div class="clientes">
        <div class="contra" id="login">
            <h1>login</h1>
            <form action="cliemtelogin.php" method="POST" autocomplete="off">
                <label for="email">E-mail</label>
                <input type="email" name="email" id="email" autocomplete="off">
                <label for="senha">Senha</label>
                <input type="password" name="senha" id="senha" autocomplete="off">
                <button type="submit">Entrar</button>
            </form>
        </div>
        <div class="contra" id="contra">
            <h1>contra</h1>
            <form action="clientecontra.php" method="POST" autocomplete="off">
                <label for="nome">Nome completo</label>
                <input type="text" name="nome" id="nome" autocomplete="off">
                <label for="email">E-mail</label>
                <input type="email" name="email" id="email" autocomplete="off">
                <label for="senha">Senha</label>
                <input type="password" name="senha" id="senha" autocomplete="off">
                <button type="submit">Entrar</button>
            </form>
        </div>

        <div id="animacao">
            <button onclick="irParaLogin()">Login</button>
            <button onclick="irParaCadastro()">Cadastro</button>
        </div>
    </div>

    <script src="contra.js"></script>
</body>
</html>
