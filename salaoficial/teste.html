<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Salão do João</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #ffe5b4, #ffb347);
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  margin: 0;
}

form {
  background: #fff;
  padding: 25px;
  border-radius: 15px;
  width: 100%;
  max-width: 450px;
  box-shadow: 0 0 15px rgba(0,0,0,.2);
}

h1 {
  text-align: center;
  color: #ff6600;
}

label {
  display: block;
  margin-top: 12px;
  font-weight: bold;
}

input[type="text"],
input[type="tel"] {
  width: 100%;
  padding: 8px;
  border-radius: 8px;
  border: 1px solid #ccc;
  margin-top: 5px;
}

.slideshow {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-top: 8px;
}

.slideshow button {
  background: #ff6600;
  border: none;
  color: white;
  padding: 6px 10px;
  border-radius: 8px;
  cursor: pointer;
}

#datas {
  display: flex;
  gap: 6px;
  overflow: hidden;
  width: 260px;
}

.data {
  min-width: 65px;
  text-align: center;
  padding: 8px;
  background: #eee;
  border-radius: 10px;
  cursor: pointer;
  font-weight: bold;
}

.data.active {
  background: #ff6600;
  color: white;
}

#horarios {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 10px;
}

.hora {
  padding: 8px 12px;
  border-radius: 8px;
  background: green;
  color: white;
  cursor: pointer;
  font-weight: bold;
}

.hora.ocupado {
  background: red;
  cursor: not-allowed;
}

.hora.selecionado {
  background: #ff6600;
}

.servico {
  margin-top: 8px;
}

button[type="submit"] {
  width: 100%;
  margin-top: 15px;
  padding: 10px;
  background: #ff6600;
  color: white;
  border: none;
  border-radius: 10px;
  font-size: 16px;
  cursor: pointer;
}

#mensagem {
  text-align: center;
  margin-top: 10px;
  font-weight: bold;
}
</style>
</head>

<body>

<form id="agendamentoForm">
  <h1>Salão do João</h1>

  <label>Nome Completo</label>
  <input type="text" id="nome" required>

  <label>Telefone</label>
  <input type="tel" id="telefone" placeholder="(61) 9575-6256" required>

  <label>Escolha a data</label>
  <div class="slideshow">
    <button type="button" id="prev">◀</button>
    <div id="datas"></div>
    <button type="button" id="next">▶</button>
  </div>

  <label>Horários disponíveis</label>
  <div id="horarios"></div>

  <input type="hidden" id="data" required>

  <label>Serviços</label>
  <div class="servico"><input type="checkbox" value="Corte de Cabelo"> Corte de Cabelo (R$20)</div>
  <div class="servico"><input type="checkbox" value="Coloração"> Coloração (R$23)</div>
  <div class="servico"><input type="checkbox" value="Hidratação"> Hidratação (R$20)</div>

  <button type="submit">Enviar</button>
  <p id="mensagem"></p>
</form>

<script>
let inicio = 0;
const diasMostrar = 7;
const datasDiv = document.getElementById("datas");
const horariosDiv = document.getElementById("horarios");
const inputData = document.getElementById("data");

function gerarDatas() {
  datasDiv.innerHTML = "";
  for (let i = inicio; i < inicio + diasMostrar; i++) {
    let d = new Date();
    d.setDate(d.getDate() + i);

    if (d.getDay() === 0) continue; // domingo

    const dia = String(d.getDate()).padStart(2, '0');
    const mes = String(d.getMonth()+1).padStart(2, '0');
    const ano = d.getFullYear();

    const div = document.createElement("div");
    div.className = "data";
    div.textContent = `${dia}/${mes}`;

    div.onclick = () => {
      document.querySelectorAll(".data").forEach(e => e.classList.remove("active"));
      div.classList.add("active");
      carregarHorarios(`${ano}-${mes}-${dia}`);
    };

    datasDiv.appendChild(div);
  }
}

document.getElementById("next").onclick = () => { inicio++; gerarDatas(); };
document.getElementById("prev").onclick = () => { if (inicio > 0) inicio--; gerarDatas(); };

function gerarHorarios() {
  let h = [];
  for (let i=7;i<12;i++) h.push(`${String(i).padStart(2,'0')}:00`);
  for (let i=13;i<18;i++) h.push(`${String(i).padStart(2,'0')}:00`);
  return h;
}

function getAgendamentos() {
  return JSON.parse(localStorage.getItem("agendamentos") || "[]");
}

function carregarHorarios(data) {
  horariosDiv.innerHTML = "";
  gerarHorarios().forEach(h => {
    const dataCompleta = `${data}T${h}`;
    const ocupado = getAgendamentos().some(a => a.data === dataCompleta);

    const div = document.createElement("div");
    div.className = "hora";
    div.textContent = h;

    if (ocupado) {
      div.classList.add("ocupado");
    } else {
      div.onclick = () => {
        document.querySelectorAll(".hora").forEach(e => e.classList.remove("selecionado"));
        div.classList.add("selecionado");
        inputData.value = dataCompleta;
      };
    }

    horariosDiv.appendChild(div);
  });
}

gerarDatas();

document.getElementById("agendamentoForm").onsubmit = e => {
  e.preventDefault();

  const nome = nome.value;
  const telefone = telefone.value;
  const data = inputData.value;

  const servicos = [...document.querySelectorAll('input[type="checkbox"]:checked')]
    .map(e => e.value).join(", ");

  if (!data || !servicos) {
    mensagem.textContent = "Escolha data, horário e serviço.";
    return;
  }

  const ag = getAgendamentos();
  ag.push({nome, telefone, data, servicos});
  localStorage.setItem("agendamentos", JSON.stringify(ag));

  window.open(`https://wa.me/556195756256?text=${encodeURIComponent(
    `Novo agendamento:\n${nome}\n${telefone}\n${servicos}\n${data}`
  )}`);

  mensagem.style.color = "green";
  mensagem.textContent = "Agendamento realizado!";
  e.target.reset();
};
</script>

</body>
</html>
