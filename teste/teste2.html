 <!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="teste2.css">
    <!-- Material Symbols -->
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
</head>
<body>
    <div class="cliente">
        <!--conecte-se-->
        <div class="conta" id="conecte">
            <form>
                <h1>Conecte-se</h1>
                <div class="input-box">
                    <!--<label for="email">E-mail</label>-->
                    <input type="email" id="Loginemail" placeholder="E-mail">
                    <span class="material-symbols-outlined">mail</span>
                </div>

                <div class="input-box">
                    <!--<label for="senha">Senha</label>-->
                    <input type="password" id="Loginsenha" placeholder="Senha">
                    <span class="material-symbols-outlined">lock</span>
                </div>
                <button>Entrar</button>
            </form>
        </div>
        <!--criar um conta-->
           <div class="conta" id="criar">
            <form>
                <h1>Criar uma conta</h1>
                <div class="input-box">
                    <!--<label for="email">E-mail</label>-->
                    <input type="text" id="usuario" placeholder="Nome completo">
                    <span class="material-symbols-outlined">person</span>
                </div>
                <div class="input-box">
                    <!--<label for="email">E-mail</label>-->
                    <input type="email" id="email" placeholder="E-mail">
                    <span class="material-symbols-outlined">mail</span>
                </div>
                <div class="input-box">
                    <!--<label for="senha">Senha</label>-->
                    <input type="password" id="senha" placeholder="Senha">
                    <span class="material-symbols-outlined">lock</span>
                </div>
                <button>Entrar</button>
            </form>
        </div>

        <div class="animacao">
            <div class="panel">
                <h1>seja bem-vindo!</h1>
                <p>Ainda não tem uma conta? Crie uma.</p>
                <button class="entrar">Cadastro</button>
            </div>
        </div>
    </div>
</body>
</html>
