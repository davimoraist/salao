 <!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste de Pagamento Asaas</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }

        label {
            font-weight: bold;
            color: #555;
            display: block;
            margin-top: 10px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #0066ff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            margin-top: 20px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0052cc;
        }

        #resultado {
            margin-top: 20px;
            padding: 15px;
            border-radius: 4px;
            display: none;
            text-align: center;
            word-break: break-all;
        }

        .sucesso {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>Finalizar Pagamento (Pix)</h2>
        <form id="formPagamento">
            <label for="nome">Nome Completo:</label>
            <input type="text" id="nome" required placeholder="Ex: João Silva">

            <label for="cpf">CPF:</label>
            <input type="text" id="cpf" required placeholder="Apenas números">

            <label for="valor">Valor (R$):</label>
            <input type="number" id="valor" step="0.01" required placeholder="Ex: 50.00">

            <button type="submit" id="btnPagar">Gerar Pix de Teste</button>
        </form>

        <div id="resultado"></div>
    </div>

    <script>
        document.getElementById('formPagamento').addEventListener('submit', async (e) => {
            e.preventDefault();

            const btn = document.getElementById('btnPagar');
            const resultadoDiv = document.getElementById('resultado');

            btn.innerText = "Processando...";
            btn.disabled = true;

            // Dados que o JavaScript vai mandar para o PHP
            const dados = {
                nome: document.getElementById('nome').value,
                cpf: document.getElementById('cpf').value,
                valor: document.getElementById('valor').value
            };

            try {
                // Envia os dados para o arquivo PHP
                const resposta = await fetch('pagamento.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dados)
                });

                const json = await resposta.json();

                resultadoDiv.style.display = "block";
                if (json.success) {
                    resultadoDiv.className = "resultado sucesso";
                    resultadoDiv.innerHTML = `
                    <h3>Pix Gerado com Sucesso!</h3>
                    <p><strong>Copia e Cola:</strong></p>
                    <textarea style="width:100%; height:60px; font-size:12px;">${json.payload}</textarea>
                    <p>Abra o app do seu banco no celular e use a opção Pix Copia e Cola.</p>
                `;
                } else {
                    resultadoDiv.className = "resultado";
                    resultadoDiv.style.backgroundColor = "#f8d7da";
                    resultadoDiv.style.color = "#721c24";
                    resultadoDiv.innerHTML = `<strong>Erro:</strong> ${json.error}`;
                }
            } catch (erro) {
                alert("Erro ao conectar com o servidor.");
            } finally {
                btn.innerText = "Gerar Pix de Teste";
                btn.disabled = false;
            }
        });
    </script>

</body>

</html>
